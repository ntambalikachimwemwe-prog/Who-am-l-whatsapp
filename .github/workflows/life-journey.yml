name: Life Journey 2D build and deploy

on:
  push:
    branches: [life-simulator-game]
    paths:
      - "life-simulator/**"
      - ".github/workflows/life-journey.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install matching official Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.4.1"
          TEMPLATE_ARCHIVE="Godot_v${VERSION}-stable_export_templates.tpz"
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${VERSION}-stable/${TEMPLATE_ARCHIVE}"
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          curl --fail --location --retry 3 "$TEMPLATE_URL" --output "/tmp/${TEMPLATE_ARCHIVE}"
          mkdir -p /tmp/godot-templates
          unzip -q "/tmp/${TEMPLATE_ARCHIVE}" -d /tmp/godot-templates
          test -d /tmp/godot-templates/templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"

      - name: Import project and validate scripts
        run: godot --headless --editor --path life-simulator --quit

      - name: Run scene smoke test
        run: godot --headless --path life-simulator --quit-after 5

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path life-simulator --export-release "Web" build/web/index.html

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path life-simulator --export-release "Windows Desktop" build/windows/LifeJourney.exe

      - name: Upload playable builds
        uses: actions/upload-artifact@v4
        with:
          name: life-journey-web-and-windows
          path: |
            build/web/
            build/windows/
          if-no-files-found: error
          retention-days: 14

      - name: Upload web build for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Life Journey to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
