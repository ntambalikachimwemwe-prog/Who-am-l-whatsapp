name: Godot project validation

on:
  push:
    branches: [life-simulator-game]
    paths:
      - "life-simulator/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    branches: [life-simulator-game]
    paths:
      - "life-simulator/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import project and parse scripts
        run: godot --headless --editor --path life-simulator --quit
      - name: Launch main scene headlessly
        run: timeout 20s godot --headless --path life-simulator --quit-after 3
