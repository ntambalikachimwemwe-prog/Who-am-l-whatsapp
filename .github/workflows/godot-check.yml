name: Godot validation and exports

on:
  push:
    branches: [life-simulator-game]
    paths:
      - "life-simulator/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    branches: [life-simulator-game]
    paths:
      - "life-simulator/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Import project and parse scripts
        run: godot --headless --editor --path life-simulator --quit
      - name: Run main scene headlessly
        run: timeout 20s godot --headless --path life-simulator --quit-after 3
      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path life-simulator --export-release "Web" build/web/index.html
      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path life-simulator --export-release "Windows Desktop" build/windows/LifeJourney.exe
      - name: Upload game builds
        uses: actions/upload-artifact@v4
        with:
          name: life-journey-web-and-windows
          path: |
            build/web/
            build/windows/
