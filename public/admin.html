<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who Am I? Admin</title><style>body{font:15px system-ui;background:#0b1220;color:#f2f6fc;max-width:900px;margin:auto;padding:20px}section{background:#121e31;border:1px solid #26364d;border-radius:14px;padding:16px;margin:14px 0}input,button{padding:11px;border-radius:8px;border:1px solid #344861;margin:5px;background:#0b1627;color:#fff}button{background:#7cdbb2;color:#08251c;font-weight:bold}article{border-top:1px solid #344861;padding:12px 0;overflow-wrap:anywhere}img{max-width:260px;display:block;margin:8px 0}small{color:#aab8c9}.hidden{display:none}.actions{display:flex;gap:6px;flex-wrap:wrap}</style></head><body><h1>Who Am I? — Admin</h1><p>Private manual review dashboard. Verify the payment in your Airtel/TNM account before approving.</p><section id="login"><h2>Admin login</h2><input id="password" type="password" placeholder="Admin password"><button onclick="login()">Sign in</button><p id="error"></p></section><div id="dashboard" class="hidden"><button onclick="refresh()">Refresh queue</button><h2>Deposit submissions</h2><section id="deposits"></section><h2>Withdrawal requests</h2><section id="withdrawals"></section><h2>Game balances</h2><section id="balances"></section></div><script>let token="";const $=x=>document.getElementById(x);async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"}});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}async function login(){try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Login failed");token=d.token;$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");refresh()}catch(e){$("error").textContent=e.message}}async function act(url){try{await api(url,{method:"POST",body:"{}"});await refresh()}catch(e){alert(e.message)}}async function refresh(){try{const d=await api("/api/admin/queue");$("deposits").innerHTML=d.deposits.length?d.deposits.map(x=>'<article><b>'+esc(x.playerName)+'</b> — '+esc(x.roomCode)+' / seat '+x.seat+'<br>MK'+x.amount+' via '+esc(x.method.toUpperCase())+'<br>Reference: '+esc(x.reference||"not supplied")+'<br>Status: '+esc(x.status)+'<img src="'+x.screenshot+'" alt="Payment screenshot"><div class="actions"><button onclick="act(\'/api/admin/deposits/'+x.id+'/approve\')">Approve</button><button onclick="act(\'/api/admin/deposits/'+x.id+'/reject\')">Reject</button></div></article>').join(""):"<p>No deposits yet.</p>";$("withdrawals").innerHTML=d.withdrawals.length?d.withdrawals.map(x=>'<article><b>'+esc(x.playerName)+'</b> requests MK'+x.amount+' to '+esc(x.method.toUpperCase())+' '+esc(x.number)+'<br>Status: '+esc(x.status)+'<div class="actions">'+(x.status==="pending"?'<button onclick="act(\'/api/admin/withdrawals/'+x.id+'/paid\')">Mark paid</button>':"")+'</div></article>').join(""):"<p>No withdrawal requests.</p>";$("balances").innerHTML=d.balances.map(x=>'<article>'+esc(x.player)+': <b>MK'+x.balance+'</b></article>').join("")||"<p>No balances yet.</p>"}catch(e){$("error").textContent=e.message}}function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</script></div></body></html>
