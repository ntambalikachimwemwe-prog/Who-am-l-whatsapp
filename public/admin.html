<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorting Battle Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#11101e;color:#f8f5ff;font:15px system-ui;padding:18px}main{max-width:900px;margin:auto}.card{background:#1c1a30;border:1px solid #383452;border-radius:16px;padding:16px;margin:12px 0}input,button{padding:12px;border-radius:10px;border:1px solid #494365;background:#11101e;color:#fff;font:inherit}button{background:#ff6d9e;color:#211326;font-weight:800;cursor:pointer}button.alt{background:#302c49;color:#fff}h1{font-size:22px}.muted{color:#aaa5c3;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#151427;padding:12px;border-radius:12px}.value{font-size:23px;color:#ffd36e;font-weight:900}.item{padding:12px 0;border-bottom:1px solid #383452;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.item:last-child{border:0}.actions{display:flex;gap:6px}.hidden{display:none}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><main><h1>⚡ Sorting Battle — Admin</h1><p class="muted">Private virtual-credit control panel. No real deposits or cash withdrawals.</p>
<section id="login" class="card"><h3>Admin sign in</h3><input id="pass" type="password" placeholder="Admin password" style="width:100%"><p><button id="signin">SIGN IN</button></p><div id="err" class="muted"></div></section>
<section id="panel" class="hidden"><div class="stats"><div class="stat">Players<div class="value" id="players">0</div></div><div class="stat">Virtual credits outstanding<div class="value" id="credits">0</div></div><div class="stat">Operator virtual share<div class="value" id="share">0</div></div></div>
<div class="card"><h3>Pending requests</h3><div id="requests"></div></div><div class="card"><h3>Player balances</h3><div id="wallets"></div></div><div class="card"><h3>Virtual-credit ledger</h3><div id="ledger"></div></div><button class="alt" id="refresh">REFRESH</button> <button class="alt" id="logout">LOG OUT</button></section></main>
<script>
let password="";const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString();
async function api(url,body){const r=await fetch(url,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","x-admin-password":password},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function load(){try{const d=await api("/api/admin/summary");$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("players").textContent=d.totals.players;$("credits").textContent=fmt(d.totals.credits);$("share").textContent=fmt(d.totals.operatorShare);
$("requests").innerHTML=d.requests.length?d.requests.map(x=>'<div class="item"><div><b>'+esc(x.player)+'</b><br>'+esc(x.type)+' · '+fmt(x.amount)+' virtual credits<br><span class="muted">'+esc(x.status)+' · '+new Date(x.createdAt).toLocaleString()+'</span></div>'+(x.status==="pending"?'<div class="actions"><button data-id="'+x.id+'" data-action="approve">APPROVE</button><button class="alt" data-id="'+x.id+'" data-action="reject">REJECT</button></div>':'<b>'+esc(x.status)+'</b>')+'</div>').join(""):'<p class="muted">No requests yet.</p>';
$("wallets").innerHTML=d.wallets.map(w=>'<div class="item"><b>'+esc(w.name)+'</b><span class="value">'+fmt(w.balance)+'</span></div>').join("")||'<p class="muted">No players yet.</p>';
$("ledger").innerHTML=d.ledger.slice(0,60).map(x=>'<div class="item"><span>'+esc(x.player)+' · '+esc(x.type)+'</span><b>'+fmt(x.amount)+'</b></div>').join("")||'<p class="muted">No approved transactions yet.</p>';
}catch(e){$("err").textContent=e.message;$("login").classList.remove("hidden");$("panel").classList.add("hidden")}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("signin").onclick=()=>{password=$("pass").value;load()};$("refresh").onclick=load;$("logout").onclick=()=>{password="";$("panel").classList.add("hidden");$("login").classList.remove("hidden")};
$("requests").onclick=async e=>{const b=e.target.closest("button[data-id]");if(!b)return;try{await api("/api/admin/request/"+b.dataset.id,{action:b.dataset.action});await load()}catch(x){alert(x.message)}};
</script></body></html>
