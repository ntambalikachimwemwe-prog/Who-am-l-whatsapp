<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorting Battle Wallet</title><style>*{box-sizing:border-box}body{margin:0;background:#11101e;color:#f8f5ff;font:15px system-ui;padding:18px}.wrap{max-width:540px;margin:auto}.card{background:#1c1a30;border:1px solid #383452;border-radius:16px;padding:17px;margin:12px 0}input,select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #494365;background:#11101e;color:#fff;font:inherit;margin:5px 0}button{background:#ff6d9e;color:#211326;font-weight:800}.balance{font-size:34px;color:#ffd36e;font-weight:900}.muted{color:#aaa5c3;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:10px 0;border-bottom:1px solid #383452}</style></head><body><div class="wrap"><h1>💳 Virtual Wallet</h1><p class="muted">Game credits only — no real money or mobile-money payments.</p><div class="card"><label>Player name</label><input id="name" placeholder="Use the same name as in the game"><button id="load">VIEW BALANCE</button><div id="bal" class="balance">—</div><div class="muted">Virtual credits</div></div><div class="card"><h3>Request virtual credits</h3><select id="type"><option value="deposit">Virtual deposit request</option><option value="withdrawal">Virtual withdrawal request</option></select><input id="amount" type="number" min="1" step="1" placeholder="Amount"><button id="send">SUBMIT REQUEST</button><div id="msg" class="muted"></div></div><div class="card"><h3>My requests</h3><div id="history" class="muted">Enter your player name to load.</div></div><p><a href="/" style="color:#ff9dbd">Back to game</a></p></div><script>const $=id=>document.getElementById(id);async function load(){const name=$("name").value.trim();if(!name)return;$("msg").textContent="";const r=await fetch("/api/wallet?name="+encodeURIComponent(name));const d=await r.json();if(!r.ok){$("msg").textContent=d.error;return}$("bal").textContent=Number(d.balance).toLocaleString();$("history").innerHTML=d.requests.length?d.requests.map(x=>'<div class="item">'+x.type+' · '+Number(x.amount).toLocaleString()+' · <b>'+x.status+'</b></div>').join(""):'No requests yet.'} $("load").onclick=load;$("send").onclick=async()=>{const r=await fetch("/api/wallet/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("name").value,amount:Number($("amount").value),type:$("type").value})});const d=await r.json();$("msg").textContent=r.ok?"Request submitted for admin approval.":d.error;if(r.ok)load()};</script></body></html>
